<H2>Test fixture in the format of the Icon reference pages (written for icontools)</H2>
<HR>
<H3><A NAME = "left">
left (s1,i,s2) : s3  -- put string on the left
</A></H3>

Pads s1 on the right with copies of s2 to make
a string of length i.

<PRE>
Defaults:
i       1
s2      &quot; &quot;

See also: <A HREF = "funcpr.htm#right">right()</A>
</PRE>
