# Release: runs when a version tag (v1.2.3) is pushed. Builds icfmt and
# iconls for each platform, and the VS Code extension, and publishes them
# as a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Check version numbers match the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "const Version = \"$v\"" internal/lsp/server.go || { echo "internal/lsp Version is not $v"; exit 1; }
          grep -q "\"version\": \"$v\"" editors/vscode/package.json || { echo "editors/vscode version is not $v"; exit 1; }
          grep -q "^version = \"$v\"" editors/zed/extension.toml || { echo "editors/zed version is not $v"; exit 1; }

      - name: Test
        run: go vet ./... && go test ./...

      - name: Build icfmt and iconls
        run: |
          mkdir -p dist build
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}" arch="${target#*/}"
            name="icontools_${GITHUB_REF_NAME}_${os}_${arch}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            mkdir -p "build/$name"
            for cmd in icfmt iconls; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -trimpath -ldflags="-s -w" -o "build/$name/$cmd$ext" "./cmd/$cmd"
            done
            cp LICENSE README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done

      - name: Build the VS Code extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm run compile
          npx vsce package --out "../../dist/icon-language-${GITHUB_REF_NAME#v}.vsix"

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Binaries of `icfmt` and `iconls` for macOS, Linux and Windows, and the
          VS Code extension (`.vsix`; install with "Extensions: Install from VSIX…").

          With Go installed you can instead run
          `go install github.com/phonologus/icontools/cmd/iconls@latest` (and `icfmt`).

          On macOS the binaries are not notarized: after unpacking, run
          `xattr -d com.apple.quarantine icfmt iconls` before first use.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "icontools $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
